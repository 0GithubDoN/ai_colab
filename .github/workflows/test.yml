name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check installer scripts parse
        if: matrix.node == 22
        shell: pwsh
        run: |
          $errors = $null
          foreach ($f in 'install.ps1', 'scripts/build-windows.ps1', 'scripts/install-portable.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${f}: $_" }; exit 1 }
          }
          if ($IsLinux -or $IsMacOS) { sh -n install.sh; if ($LASTEXITCODE -ne 0) { exit 1 } }
