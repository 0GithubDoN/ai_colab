name: release
# Run it from the Actions tab (or push a v* tag): it tests, builds the portable Windows
# package and publishes a GitHub release for the version in package.json.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm test
      - run: npm ci --omit=dev
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version ${{ steps.v.outputs.version }}
      - name: Smoke test the package
        shell: pwsh
        run: |
          $out = & dist/Crewroom/crewroom.cmd --version
          if ($out -ne '${{ steps.v.outputs.version }}') { Write-Error "unexpected version: $out"; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-portable.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Crewroom ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/Crewroom-${{ steps.v.outputs.version }}-windows-x64.zip
